<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Your Delivery - Driver Coordination</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    
    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
    
    .header {
      text-align: center;
      margin-bottom: 32px;
    }
    
    .header h1 {
      font-size: 28px;
      color: white;
      margin-bottom: 8px;
    }
    
    .header p {
      color: rgba(255,255,255,0.9);
      font-size: 16px;
    }
    
    .job-id-input {
      margin-bottom: 24px;
    }
    
    .job-id-input input {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-weight: 600;
    }
    
    .btn {
      width: 100%;
      padding: 16px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .btn:hover {
      background: #5568d3;
      transform: translateY(-2px);
    }
    
    .btn-call {
      background: #28a745;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 18px;
      padding: 18px;
      margin-top: 16px;
    }
    
    .btn-call:hover {
      background: #218838;
    }
    
    .status-badge {
      display: inline-block;
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 24px;
    }
    
    .status-pending { background: #fff3cd; color: #856404; }
    .status-assigned { background: #cce5ff; color: #004085; }
    .status-in_progress { background: #d4edda; color: #155724; }
    .status-completed { background: #d4edda; color: #155724; }
    .status-cancelled { background: #f8d7da; color: #721c24; }
    .status-unassigned { background: #fff3cd; color: #856404; }
    
    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #e7f3ff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: #0066cc;
      margin-bottom: 16px;
    }
    
    .live-dot {
      width: 8px;
      height: 8px;
      background: #28a745;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    
    .timeline {
      position: relative;
      padding-left: 40px;
    }
    
    .timeline::before {
      content: '';
      position: absolute;
      left: 10px;
      top: 0;
      bottom: 0;
      width: 3px;
      background: #e0e0e0;
    }
    
    .timeline-item {
      position: relative;
      margin-bottom: 32px;
      padding-left: 20px;
    }
    
    .timeline-item::before {
      content: '';
      position: absolute;
      left: -30px;
      top: 5px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #e0e0e0;
      border: 3px solid white;
      box-shadow: 0 0 0 3px #e0e0e0;
      z-index: 1;
    }
    
    .timeline-item.completed::before {
      background: #28a745;
      box-shadow: 0 0 0 3px #28a745;
    }
    
    .timeline-item.active::before {
      background: #667eea;
      box-shadow: 0 0 0 3px #667eea;
    }
    
    .timeline-item h3 {
      font-size: 16px;
      margin-bottom: 4px;
      color: #333;
    }
    
    .timeline-item p {
      font-size: 14px;
      color: #666;
    }
    
    .driver-info {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 24px;
      border-radius: 12px;
      margin-top: 24px;
    }
    
    .driver-info h3 {
      margin-bottom: 16px;
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .driver-info p {
      margin: 12px 0;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .driver-info strong {
      opacity: 0.9;
      font-size: 14px;
    }
    
    #map {
      height: 300px;
      border-radius: 8px;
      margin-top: 24px;
    }
    
    .hidden {
      display: none;
    }
    
    .error-message {
      background: #f8d7da;
      color: #721c24;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      border: 1px solid #f5c6cb;
    }
    
    .review-section {
      background: #e7f3ff;
      padding: 24px;
      border-radius: 8px;
      margin-top: 24px;
      border-left: 4px solid #667eea;
    }
    
    .review-section h3 {
      margin-bottom: 16px;
      color: #667eea;
    }
    
    .stars {
      font-size: 32px;
      margin: 16px 0;
      cursor: pointer;
      user-select: none;
    }
    
    .star {
      color: #ddd;
      transition: color 0.2s;
    }
    
    .star.active {
      color: #ffc107;
    }
    
    textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      min-height: 100px;
    }
    
    .success-message {
      background: #d4edda;
      color: #155724;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .container { padding: 12px; }
      .header h1 { font-size: 24px; }
      #map { height: 250px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🚗 Track Your Delivery</h1>
      <p>Enter your job ID to track your car's pickup/delivery</p>
    </div>

    <div class="card">
      <div class="job-id-input">
        <input 
          type="text" 
          id="jobIdInput" 
          placeholder="#dbcd6c78" 
          autocomplete="off"
        >
      </div>
      <button class="btn" onclick="trackJob()">Track My Car</button>
      
      <div id="errorMessage" class="error-message hidden"></div>
      
      <div id="jobDetails" class="hidden">
        <div class="live-indicator">
          <span class="live-dot"></span>
          <span>Live Tracking Active - Auto-refreshing every 5 seconds</span>
        </div>
        
        <h2 style="margin-bottom: 16px;">Job Status</h2>
        <div id="statusBadge"></div>
        
        <div class="timeline" id="timeline"></div>
        
        <!-- ENHANCED DRIVER INFO WITH CALL BUTTON -->
        <div id="driverInfo" class="driver-info hidden">
          <h3>👤 Your Driver</h3>
          <p><strong>Name:</strong> <span id="driverName"></span></p>
          <p><strong>Phone:</strong> <span id="driverPhone"></span></p>
          <a href="#" id="callDriverBtn" class="btn btn-call">
            📞 Call Driver Now
          </a>
        </div>
        
        <div id="map"></div>
        
        <div id="reviewSection" class="review-section hidden">
          <h3>⭐ How was your experience?</h3>
          <p>Please rate your driver</p>
          <div class="stars" id="stars">
            <span class="star" data-rating="1">★</span>
            <span class="star" data-rating="2">★</span>
            <span class="star" data-rating="3">★</span>
            <span class="star" data-rating="4">★</span>
            <span class="star" data-rating="5">★</span>
          </div>
          <textarea id="comments" placeholder="Tell us about your experience (optional)"></textarea>
          <button class="btn" onclick="submitReview()" style="margin-top: 16px;">Submit Review</button>
        </div>
        
        <div id="thankYou" class="success-message hidden">
          ✅ Thank you for your feedback!
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const protocol = window.location.protocol;
    const host = window.location.host;
    const API_URL = `${protocol}//${host}`;
    
    console.log('🌐 API URL:', API_URL);
    
    let map = null;
    let jobData = null;
    let refreshInterval = null;
    let selectedRating = 0;
    let driverMarker = null;
    let pickupMarker = null;
    let dropoffMarker = null;

    async function trackJob() {
      const jobId = document.getElementById('jobIdInput').value.trim();
      
      if (!jobId) {
        showError('Please enter a job ID');
        return;
      }

      console.log('🔍 Tracking job:', jobId);

      try {
        const response = await fetch(`${API_URL}/api/jobs/${jobId}`);
        
        console.log('📡 Response status:', response.status);
        
        if (!response.ok) {
          if (response.status === 404) {
            showError('Job not found. Please check your Job ID.');
          } else {
            showError(`Error ${response.status}: ${response.statusText}`);
          }
          return;
        }

        jobData = await response.json();
        console.log('📊 Job Data Received:', jobData);
        
        // CRITICAL FIX: Set default status if missing
        if (!jobData.status || jobData.status === 'undefined') {
          console.warn('⚠️ Job status is missing, setting to "pending"');
          jobData.status = 'pending';
        }
        
        displayJobDetails();
        
        // ENHANCED: Auto-refresh for ALL active jobs (not just assigned/in_progress)
        if (!['completed', 'cancelled'].includes(jobData.status)) {
          if (refreshInterval) clearInterval(refreshInterval);
          
          // Refresh every 5 seconds for real-time updates
          refreshInterval = setInterval(() => {
            console.log('🔄 Auto-refreshing job status...');
            trackJobSilent();
          }, 5000);
          
          console.log('✅ Real-time tracking activated (5-second refresh)');
        } else {
          // Stop refreshing if job is completed/cancelled
          if (refreshInterval) {
            clearInterval(refreshInterval);
            refreshInterval = null;
            console.log('⏹️ Job finished - stopping auto-refresh');
          }
        }
        
      } catch (error) {
        console.error('❌ Error loading job:', error);
        showError(`Failed to load job: ${error.message}`);
      }
    }

    // Silent refresh (doesn't show loading states)
    async function trackJobSilent() {
      const jobId = document.getElementById('jobIdInput').value.trim();
      
      try {
        const response = await fetch(`${API_URL}/api/jobs/${jobId}`);
        if (response.ok) {
          const newData = await response.json();
          
          // Check if status changed
          if (jobData.status !== newData.status) {
            console.log('🔔 Status changed:', jobData.status, '→', newData.status);
          }
          
          jobData = newData;
          if (!jobData.status) jobData.status = 'pending';
          
          displayJobDetails();
          
          // Stop refreshing if job completed
          if (['completed', 'cancelled'].includes(jobData.status)) {
            if (refreshInterval) {
              clearInterval(refreshInterval);
              refreshInterval = null;
            }
          }
        }
      } catch (error) {
        console.error('Silent refresh failed:', error);
      }
    }

    function showError(message) {
      console.error('❌', message);
      document.getElementById('errorMessage').textContent = message;
      document.getElementById('errorMessage').classList.remove('hidden');
      document.getElementById('jobDetails').classList.add('hidden');
    }

    function displayJobDetails() {
      document.getElementById('errorMessage').classList.add('hidden');
      document.getElementById('jobDetails').classList.remove('hidden');
      
      // Status badge
      const statusLabels = {
        pending: 'Finding Driver...',
        assigned: 'Driver Assigned',
        in_progress: 'In Transit',
        completed: 'Completed',
        cancelled: 'Cancelled',
        unassigned: 'Looking for Driver...'
      };
      
      const statusLabel = statusLabels[jobData.status] || jobData.status || 'Unknown';
      const statusClass = jobData.status || 'pending';
      
      document.getElementById('statusBadge').innerHTML = `
        <span class="status-badge status-${statusClass}">
          ${statusLabel}
        </span>
      `;
      
      // Timeline
      const timelineSteps = [
        { key: 'created', label: 'Job Created', time: jobData.created_at },
        { key: 'assigned', label: 'Driver Assigned', time: jobData.assigned_at },
        { key: 'started', label: 'Pickup Completed', time: jobData.started_at },
        { key: 'completed', label: 'Delivered', time: jobData.completed_at }
      ];
      
      const statusOrder = ['pending', 'unassigned', 'assigned', 'in_progress', 'completed'];
      const currentIndex = statusOrder.indexOf(jobData.status);
      
      let timelineHTML = '';
      timelineSteps.forEach((step, index) => {
        let itemClass = '';
        if (index < currentIndex) itemClass = 'completed';
        else if (index === currentIndex) itemClass = 'active';
        
        timelineHTML += `
          <div class="timeline-item ${itemClass}">
            <h3>${step.label}</h3>
            <p>${step.time ? new Date(step.time).toLocaleString() : 'Pending'}</p>
          </div>
        `;
      });
      
      document.getElementById('timeline').innerHTML = timelineHTML;
      
      // ENHANCED DRIVER INFO WITH CALL BUTTON
      if (jobData.driver_name && jobData.driver_phone) {
        document.getElementById('driverInfo').classList.remove('hidden');
        document.getElementById('driverName').textContent = jobData.driver_name;
        document.getElementById('driverPhone').textContent = jobData.driver_phone;
        
        // Set click-to-call link
        const callBtn = document.getElementById('callDriverBtn');
        callBtn.href = `tel:${jobData.driver_phone}`;
        
        console.log('📞 Driver contact available:', jobData.driver_name, jobData.driver_phone);
      } else {
        document.getElementById('driverInfo').classList.add('hidden');
      }
      
      // Map
      if (!map) {
        map = L.map('map').setView([18.5204, 73.8567], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© OpenStreetMap'
        }).addTo(map);
      }
      
      // Clear old markers
      if (pickupMarker) map.removeLayer(pickupMarker);
      if (dropoffMarker) map.removeLayer(dropoffMarker);
      if (driverMarker) map.removeLayer(driverMarker);
      
      // Add pickup marker
      if (jobData.pickup_lat && jobData.pickup_lng) {
        pickupMarker = L.marker([jobData.pickup_lat, jobData.pickup_lng])
          .addTo(map)
          .bindPopup('📍 Pickup: ' + (jobData.pickup_address || 'Start Location'));
      }
      
      // Add dropoff marker
      if (jobData.dropoff_lat && jobData.dropoff_lng) {
        dropoffMarker = L.marker([jobData.dropoff_lat, jobData.dropoff_lng])
          .addTo(map)
          .bindPopup('🏁 Dropoff: ' + (jobData.dropoff_address || 'End Location'));
      }
      
      // Add driver marker (if assigned and has location)
      if (jobData.driver_lat && jobData.driver_lng && jobData.status !== 'completed') {
        const driverIcon = L.divIcon({
          html: `<div style="background: #28a745; color: white; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 3px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.3);">🚗</div>`,
          className: '',
          iconSize: [36, 36]
        });
        
        driverMarker = L.marker([jobData.driver_lat, jobData.driver_lng], { icon: driverIcon })
          .addTo(map)
          .bindPopup(`🚗 Driver: ${jobData.driver_name || 'On the way'}`);
        
        // Center map on driver if in progress
        if (jobData.status === 'in_progress') {
          map.setView([jobData.driver_lat, jobData.driver_lng], 14);
        }
      }
      
      // Fit map to show all markers
      if (pickupMarker && dropoffMarker) {
        const bounds = L.latLngBounds([
          pickupMarker.getLatLng(),
          dropoffMarker.getLatLng()
        ]);
        if (driverMarker) bounds.extend(driverMarker.getLatLng());
        map.fitBounds(bounds, { padding: [50, 50] });
      }
      
      // Show review section if completed
      if (jobData.status === 'completed') {
        document.getElementById('reviewSection').classList.remove('hidden');
        setupStarRating();
      }
    }

    function setupStarRating() {
      const stars = document.querySelectorAll('.star');
      stars.forEach(star => {
        star.addEventListener('click', function() {
          selectedRating = parseInt(this.dataset.rating);
          updateStars();
        });
        
        star.addEventListener('mouseover', function() {
          const rating = parseInt(this.dataset.rating);
          highlightStars(rating);
        });
      });
      
      document.getElementById('stars').addEventListener('mouseout', () => {
        updateStars();
      });
    }

    function highlightStars(rating) {
      const stars = document.querySelectorAll('.star');
      stars.forEach((star, index) => {
        if (index < rating) {
          star.classList.add('active');
        } else {
          star.classList.remove('active');
        }
      });
    }

    function updateStars() {
      highlightStars(selectedRating);
    }

    async function submitReview() {
      if (selectedRating === 0) {
        alert('Please select a star rating');
        return;
      }
      
      const comments = document.getElementById('comments').value;
      
      try {
        const response = await fetch(`${API_URL}/api/reviews`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            job_id: jobData.id,
            rating: selectedRating,
            comments: comments
          })
        });
        
        if (response.ok) {
          document.getElementById('reviewSection').classList.add('hidden');
          document.getElementById('thankYou').classList.remove('hidden');
        } else {
          const error = await response.json();
          alert('Failed to submit review: ' + error.error);
        }
      } catch (error) {
        console.error('Review submission error:', error);
        alert('Failed to submit review. Please check your connection.');
      }
    }

    // Check for job ID in URL (e.g., ?job=abc123)
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const jobId = urlParams.get('job');
      if (jobId) {
        console.log('📄 Auto-loading job from URL:', jobId);
        document.getElementById('jobIdInput').value = jobId;
        trackJob();
      }
    });
    
    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      if (refreshInterval) {
        clearInterval(refreshInterval);
      }
    });
  </script>
</body>
</html>
