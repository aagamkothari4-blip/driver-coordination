<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver App - Driver Coordination</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      padding-bottom: 80px;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-size: 20px; margin-bottom: 4px; }
    .header p { font-size: 14px; opacity: 0.9; }
    
    .btn-logout {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }
    
    .status-toggle {
      background: white;
      margin: 16px;
      padding: 16px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .switch {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 34px;
    }
    
    .switch input { opacity: 0; width: 0; height: 0; }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 34px;
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 26px;
      width: 26px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    
    input:checked + .slider { background-color: #28a745; }
    input:checked + .slider:before { transform: translateX(26px); }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 16px;
    }
    
    .stat-card {
      background: white;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
    }
    
    .stat-card h3 { font-size: 12px; color: #666; margin-bottom: 8px; }
    .stat-card .value { font-size: 24px; font-weight: bold; color: #333; }
    
    .section {
      background: white;
      margin: 16px;
      padding: 20px;
      border-radius: 8px;
    }
    
    .section h2 { font-size: 18px; margin-bottom: 16px; }
    
    #map { height: 400px; border-radius: 8px; margin: 16px 0; border: 2px solid #e0e0e0; }
    
    .btn {
      padding: 14px 24px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      margin-top: 12px;
    }
    
    .btn-primary { background: #007bff; color: white; }
    .btn-success { background: #28a745; color: white; }
    .btn-warning { background: #ffc107; color: #333; }
    .btn-danger { background: #dc3545; color: white; }
    
    .job-notification {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.3s;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .notification-card {
      background: white;
      border-radius: 16px;
      padding: 32px;
      max-width: 400px;
      width: 90%;
      animation: slideUp 0.4s;
    }
    
    @keyframes slideUp {
      from { transform: translateY(50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    .notification-header {
      text-align: center;
      margin-bottom: 24px;
    }
    
    .notification-header h2 {
      font-size: 24px;
      color: #333;
      margin-bottom: 8px;
    }
    
    .countdown {
      font-size: 48px;
      font-weight: bold;
      color: #dc3545;
      margin: 20px 0;
    }
    
    .job-info {
      background: #f8f9fa;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    
    .job-info p {
      margin: 8px 0;
      font-size: 14px;
    }
    
    .hidden { display: none !important; }
    
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .login-card {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      width: 90%;
      max-width: 400px;
    }
    
    .login-card h1 {
      font-size: 28px;
      margin-bottom: 8px;
      color: #333;
    }
    
    .login-card p {
      font-size: 14px;
      color: #666;
      margin-bottom: 24px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      font-size: 14px;
      color: #333;
      margin-bottom: 8px;
      font-weight: 500;
    }
    
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .no-job-container {
      text-align: center;
      padding: 60px 20px;
      color: #666;
    }
    
    .no-job-container .car-icon {
      font-size: 64px;
      margin-bottom: 16px;
    }
    
    .active-job {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    
    .active-job h3 {
      font-size: 18px;
      color: #333;
      margin-bottom: 12px;
    }
    
    .job-detail {
      margin: 8px 0;
      font-size: 14px;
      color: #666;
    }
    
    .earnings-badge {
      background: #28a745;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      display: inline-block;
      font-weight: 600;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <!-- Login Screen -->
  <div id="loginScreen" class="login-container">
    <div class="login-card">
      <h1>🚗 Driver Login</h1>
      <p>Welcome back! Ready to start earning?</p>
      <form id="loginForm">
        <div class="form-group">
          <label>Phone Number</label>
          <input type="text" id="loginPhone" value="9876543201" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" value="driver123" required>
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
      </form>
    </div>
  </div>

  <!-- Main App -->
  <div id="driverApp" class="hidden">
    <div class="header">
      <div>
        <h1 id="driverName">Driver</h1>
        <p>Ready to accept jobs</p>
      </div>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>

    <div class="status-toggle">
      <label>🟢 Online Status</label>
      <label class="switch">
        <input type="checkbox" id="statusToggle" onchange="toggleStatus()">
        <span class="slider"></span>
      </label>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <h3>Today</h3>
        <div class="value">₹<span id="todayEarnings">0</span></div>
      </div>
      <div class="stat-card">
        <h3>Jobs</h3>
        <div class="value" id="totalJobs">0</div>
      </div>
      <div class="stat-card">
        <h3>Rating</h3>
        <div class="value">⭐ <span id="rating">0.0</span></div>
      </div>
    </div>

    <!-- No Job Section -->
    <div id="noJobSection" class="section">
      <div class="no-job-container">
        <div class="car-icon">🚗</div>
        <h2>Waiting for jobs...</h2>
        <p>Make sure you're online to receive notifications</p>
      </div>
    </div>

    <!-- Active Job -->
    <div id="activeJobSection" class="hidden">
      <div class="section">
        <h2>📍 Active Job</h2>
        <div id="activeJobDetails"></div>
        <div id="map"></div>
        <button id="actionButton" class="btn btn-primary" onclick="handleJobAction()">Mark as Picked Up</button>
        <button id="cancelButton" class="btn btn-warning" onclick="showCancelConfirm()">Cancel This Job</button>
      </div>
    </div>
  </div>

  <!-- Job Notification Modal -->
  <div id="jobNotification" class="job-notification hidden">
    <div class="notification-card">
      <div class="notification-header">
        <h2>🚗 New Job Request!</h2>
        <div class="countdown" id="countdown">30</div>
      </div>
      <div class="job-info" id="jobInfo"></div>
      <button class="btn btn-success" onclick="acceptJob()">Accept Job</button>
      <button class="btn btn-danger" onclick="declineJob()">Decline</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let currentUser = null;
    let currentDriver = null;
    let ws = null;
    let map = null;
    let currentNotification = null;
    let countdownInterval = null;
    let activeJob = null;
    let jobStatus = 'none';

    // CRITICAL: Auto-detect protocol for production
    const protocol = window.location.protocol;
    const host = window.location.host;
    const API_URL = `${protocol}//${host}`;
    const WS_URL = protocol === 'https:' ? `wss://${window.location.hostname}` : `ws://${host}`;

    console.log('API URL:', API_URL);
    console.log('WebSocket URL:', WS_URL);

    // Auto-login if session exists
    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('currentUser');
      if (savedUser) {
        try {
          const userData = JSON.parse(savedUser);
          currentUser = userData;
          currentDriver = userData;
          document.getElementById('loginScreen').classList.add('hidden');
          document.getElementById('driverApp').classList.remove('hidden');
          document.getElementById('driverName').textContent = userData.name;
          
          const savedStatus = localStorage.getItem('driverStatus');
          if (savedStatus === 'online') {
            document.getElementById('statusToggle').checked = true;
          }
          
          initDriverApp();
        } catch (error) {
          console.error('Failed to restore session:', error);
          localStorage.removeItem('currentUser');
          localStorage.removeItem('driverStatus');
        }
      }
    });

    // Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const phone = document.getElementById('loginPhone').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const response = await fetch(`${API_URL}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password })
        });

        const data = await response.json();

        if (response.ok && data.user.role === 'driver') {
          currentUser = data.user;
          currentDriver = data.user;
          localStorage.setItem('currentUser', JSON.stringify(data.user));
          document.getElementById('loginScreen').classList.add('hidden');
          document.getElementById('driverApp').classList.remove('hidden');
          document.getElementById('driverName').textContent = data.user.name;
          
          initDriverApp();
        } else {
          alert(data.error || 'Invalid credentials');
        }
      } catch (error) {
        alert('Login failed: ' + error.message);
      }
    });

    async function initDriverApp() {
      // Initialize WebSocket
      ws = new WebSocket(`${WS_URL}?userId=${currentDriver.id}`);
      
      ws.onopen = () => {
        console.log('✅ WebSocket connected');
      };
      
      ws.onerror = (error) => {
        console.error('❌ WebSocket error:', error);
      };
      
      ws.onclose = () => {
        console.log('⚠️ WebSocket disconnected');
        setTimeout(() => {
          if (currentDriver) initDriverApp();
        }, 5000);
      };
      
      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        console.log('📨 WebSocket message:', data);
        
        if (data.type === 'JOB_NOTIFICATION') {
          showJobNotification(data.job, data.timeout);
        } else if (data.type === 'JOB_CANCELLED') {
          alert('Job cancelled by manager');
          resetActiveJob();
        }
      };

      loadDriverStats();
      loadActiveJob();
    }

    function logout() {
      if (ws) ws.close();
      currentUser = null;
      currentDriver = null;
      activeJob = null;
      jobStatus = 'none';
      localStorage.removeItem('currentUser');
      localStorage.removeItem('driverStatus');
      
      document.getElementById('driverApp').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('statusToggle').checked = false;
    }

    function loadDriverStats() {
      document.getElementById('totalJobs').textContent = currentDriver.total_jobs || 0;
      document.getElementById('rating').textContent = (currentDriver.average_rating || 0).toFixed(1);
      document.getElementById('todayEarnings').textContent = currentDriver.today_earnings || 0;
    }

    async function toggleStatus() {
      const isOnline = document.getElementById('statusToggle').checked;
      const newStatus = isOnline ? 'online' : 'offline';

      try {
        await fetch(`${API_URL}/api/drivers/availability`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            driverId: currentDriver.id,
            status: newStatus
          })
        });

        currentDriver.availability_status = newStatus;
        localStorage.setItem('driverStatus', newStatus);
      } catch (error) {
        console.error('Failed to update status:', error);
      }
    }

    function showJobNotification(job, timeout) {
      currentNotification = job;
      
      const html = `
        <p><strong>Pickup:</strong> ${job.pickup_address}</p>
        <p><strong>Dropoff:</strong> ${job.dropoff_address}</p>
        <p><strong>Distance:</strong> ${job.estimated_distance ? job.estimated_distance.toFixed(1) : 'N/A'} km</p>
        <p><strong>Earnings:</strong> ₹${job.estimated_earnings || Math.round(job.estimated_distance * 50)}</p>
      `;
      
      document.getElementById('jobInfo').innerHTML = html;
      document.getElementById('jobNotification').classList.remove('hidden');
      
      let timeLeft = timeout / 1000;
      document.getElementById('countdown').textContent = timeLeft;
      
      countdownInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('countdown').textContent = timeLeft;
        
        if (timeLeft <= 0) {
          clearInterval(countdownInterval);
          declineJob();
        }
      }, 1000);
    }

    async function acceptJob() {
      clearInterval(countdownInterval);
      document.getElementById('jobNotification').classList.add('hidden');
      
      try {
        const response = await fetch(`${API_URL}/api/jobs/${currentNotification.id}/accept`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ driverId: currentDriver.id })
        });
        
        if (response.ok) {
          // CRITICAL FIX: Properly construct activeJob with ALL required fields
          activeJob = {
            id: currentNotification.id,
            pickup_address: currentNotification.pickup_address,
            pickup_lat: currentNotification.pickup_lat,
            pickup_lng: currentNotification.pickup_lng,
            dropoff_address: currentNotification.dropoff_address,
            dropoff_lat: currentNotification.dropoff_lat,
            dropoff_lng: currentNotification.dropoff_lng,
            estimated_distance: currentNotification.estimated_distance || 0,
            estimated_earnings: currentNotification.estimated_earnings || Math.round((currentNotification.estimated_distance || 0) * 50)
          };
          
          jobStatus = 'assigned';
          showActiveJob();
          console.log('✅ Job accepted:', activeJob);
        } else {
          alert('Failed to accept job');
        }
      } catch (error) {
        console.error('❌ Failed to accept job:', error);
        alert('Failed to accept job: ' + error.message);
      }
    }

    function declineJob() {
      clearInterval(countdownInterval);
      document.getElementById('jobNotification').classList.add('hidden');
      currentNotification = null;
    }

    function showActiveJob() {
      console.log('📍 showActiveJob called with:', activeJob);
      
      if (!activeJob || !activeJob.id) {
        console.error('❌ activeJob is invalid:', activeJob);
        return;
      }
      
      // Hide other sections
      document.getElementById('noJobSection').classList.add('hidden');
      
      // Show active job section
      document.getElementById('activeJobSection').classList.remove('hidden');
      
      const html = `
        <div class="active-job">
          <h3>Job #${activeJob.id.slice(0, 8)}</h3>
          <div class="job-detail"><strong>Pickup:</strong> ${activeJob.pickup_address}</div>
          <div class="job-detail"><strong>Dropoff:</strong> ${activeJob.dropoff_address}</div>
          <div class="job-detail"><strong>Distance:</strong> ${activeJob.estimated_distance.toFixed(1)} km</div>
          <div class="earnings-badge">Earnings: ₹${activeJob.estimated_earnings}</div>
        </div>
      `;
      
      document.getElementById('activeJobDetails').innerHTML = html;
      
      // Initialize map
      setTimeout(() => {
        try {
          if (map) {
            map.remove();
            map = null;
          }
          
          map = L.map('map').setView([activeJob.pickup_lat, activeJob.pickup_lng], 14);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
          
          L.marker([activeJob.pickup_lat, activeJob.pickup_lng])
            .addTo(map)
            .bindPopup('<b>Pickup</b><br>' + activeJob.pickup_address);
          
          L.marker([activeJob.dropoff_lat, activeJob.dropoff_lng])
            .addTo(map)
            .bindPopup('<b>Dropoff</b><br>' + activeJob.dropoff_address);
          
          const bounds = L.latLngBounds(
            [activeJob.pickup_lat, activeJob.pickup_lng],
            [activeJob.dropoff_lat, activeJob.dropoff_lng]
          );
          map.fitBounds(bounds, { padding: [50, 50] });
          
          console.log('✅ Map initialized');
        } catch (error) {
          console.error('❌ Map error:', error);
        }
      }, 100);
      
      updateActionButton();
    }

    function updateActionButton() {
      const actionBtn = document.getElementById('actionButton');
      const cancelBtn = document.getElementById('cancelButton');
      
      if (jobStatus === 'assigned') {
        actionBtn.textContent = 'Mark as Picked Up';
        actionBtn.className = 'btn btn-primary';
        cancelBtn.classList.remove('hidden');
      } else if (jobStatus === 'in_progress') {
        actionBtn.textContent = 'Mark as Delivered';
        actionBtn.className = 'btn btn-success';
        cancelBtn.classList.add('hidden');
      }
    }

    async function handleJobAction() {
      const actionBtn = document.getElementById('actionButton');
      
      if (jobStatus === 'assigned') {
        actionBtn.disabled = true;
        actionBtn.textContent = 'Marking as picked up...';
        
        try {
          await fetch(`${API_URL}/api/jobs/${activeJob.id}/pickup`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ driverId: currentDriver.id })
          });
          
          jobStatus = 'in_progress';
          updateActionButton();
          actionBtn.disabled = false;
          console.log('✅ Marked as picked up');
        } catch (error) {
          console.error('❌ Failed to mark as picked up:', error);
          actionBtn.disabled = false;
          actionBtn.textContent = 'Mark as Picked Up';
          alert('Failed to mark as picked up');
        }
        
      } else if (jobStatus === 'in_progress') {
        actionBtn.disabled = true;
        actionBtn.textContent = 'Completing...';
        
        try {
          const response = await fetch(`${API_URL}/api/jobs/${activeJob.id}/complete`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ driverId: currentDriver.id })
          });
          
          if (response.ok) {
            const earnings = activeJob.estimated_earnings;
            currentDriver.total_jobs = (currentDriver.total_jobs || 0) + 1;
            currentDriver.today_earnings = (currentDriver.today_earnings || 0) + earnings;
            
            localStorage.setItem('currentUser', JSON.stringify(currentDriver));
            
            alert(`✅ Job completed! You earned ₹${earnings}`);
            resetActiveJob();
            loadDriverStats();
            
            console.log('✅ Job completed');
          }
        } catch (error) {
          console.error('❌ Failed to complete job:', error);
          actionBtn.disabled = false;
          actionBtn.textContent = 'Mark as Delivered';
          alert('Failed to complete job');
        }
      }
    }

    function showCancelConfirm() {
      if (confirm('Cancel this job? You will receive a 10% penalty to your acceptance rate.')) {
        cancelActiveJob();
      }
    }

    async function cancelActiveJob() {
      try {
        await fetch(`${API_URL}/api/jobs/${activeJob.id}/cancel`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            driverId: currentDriver.id,
            reason: 'Driver cancelled'
          })
        });
        
        alert('Job cancelled');
        resetActiveJob();
      } catch (error) {
        alert('Failed to cancel job');
      }
    }

    function resetActiveJob() {
      jobStatus = 'none';
      activeJob = null;
      
      if (map) {
        map.remove();
        map = null;
      }
      
      document.getElementById('activeJobSection').classList.add('hidden');
      document.getElementById('noJobSection').classList.remove('hidden');
    }

    async function loadActiveJob() {
      try {
        const response = await fetch(`${API_URL}/api/jobs?status=assigned,in_progress`);
        const jobs = await response.json();
        
        const myJob = jobs.find(j => j.assigned_driver === currentDriver.id);
        
        if (myJob) {
          activeJob = {
            id: myJob.id,
            pickup_address: myJob.pickup_address,
            pickup_lat: myJob.pickup_lat,
            pickup_lng: myJob.pickup_lng,
            dropoff_address: myJob.dropoff_address,
            dropoff_lat: myJob.dropoff_lat,
            dropoff_lng: myJob.dropoff_lng,
            estimated_distance: myJob.estimated_distance || 0,
            estimated_earnings: Math.round((myJob.estimated_distance || 0) * 50)
          };
          
          jobStatus = myJob.status === 'in_progress' ? 'in_progress' : 'assigned';
          showActiveJob();
          console.log('✅ Restored active job');
        }
      } catch (error) {
        console.error('Failed to load active job:', error);
      }
    }
  </script>
</body>
</html>
